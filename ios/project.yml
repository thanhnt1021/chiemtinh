name: ChiemTinh
options:
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
  bundleIdPrefix: fun.jst4

settings:
  base:
    DEVELOPMENT_TEAM: GYNRKXCZPQ
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: "Thanh Dev fun"
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"

targets:
  ChiemTinh:
    type: application
    platform: iOS
    sources:
      - path: ChiemTinh/Src
      - path: ChiemTinh/Resources/ephe
        buildPhase: resources
      # W20: 14 file JSON nội dung + 8 bảng Markdown (vault). Không khai ở đây thì
      # `VaultLoader` không thấy file trong bundle.
      - path: ChiemTinh/Resources/Data
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.jst4.chiemtinh
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Chiêm Tinh
        TARGETED_DEVICE_FAMILY: "1"
        # --- Cầu nối Swift <-> C Swiss Ephemeris ---
        SWIFT_OBJC_BRIDGING_HEADER: ChiemTinh/Src/CSwissEph/ChiemTinh-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/ChiemTinh/Src/CSwissEph
        # libswe là mã C cũ (1997-2021): tắt cảnh báo cho khỏi nhiễu, KHÔNG sửa mã gốc
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
        CLANG_ENABLE_MODULES: "YES"

  ChiemTinhTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChiemTinhTests
      - path: tools/cases.json
        buildPhase: resources
    dependencies:
      - target: ChiemTinh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.jst4.chiemtinh.tests
        GENERATE_INFOPLIST_FILE: "YES"

  ChiemTinhUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChiemTinhUITests
    dependencies:
      - target: ChiemTinh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.jst4.chiemtinh.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ChiemTinh

schemes:
  ChiemTinh:
    build:
      targets:
        ChiemTinh: all
        ChiemTinhTests: [test]
        ChiemTinhUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChiemTinhTests
        - ChiemTinhUITests

{% extends "base.html" %}

{% block title %}Planet Connect - Astro System{% endblock %}

{% block head_extra %}
<style>
    .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto p-4 md:p-8 pt-16">
    <a href="/dashboard" class="text-blue-500 hover:text-blue-400 mb-6 inline-block hover:underline">&larr; Quay lại Dashboard</a>

    <header class="text-center mb-8">
        <h1 id="main-title" class="font-bold text-green-600 dark:text-green-400 whitespace-nowrap inline-block">
            BẢNG TRAO ĐỔI NĂNG LƯỢNG oHa
        </h1>
    </header>

    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-600 h-32 w-32"></div>
        <p class="ml-4 text-xl text-white">Đang đồng bộ dữ liệu...</p>
    </div>

    <!-- CONTROLS -->
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-4 md:p-6 rounded-lg shadow-lg mb-8 max-w-4xl mx-auto transition-colors">
        
        <!-- DROPDOWN CHỌN CHẾ ĐỘ -->
        <div class="mb-6">
            <label for="mode-select" class="block text-sm font-bold mb-2 text-purple-600 dark:text-purple-400 uppercase">Chế độ xem</label>
            <select id="mode-select" class="w-full bg-purple-50 dark:bg-gray-700 border border-purple-300 dark:border-purple-600 text-gray-900 dark:text-white text-sm rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 font-bold">
                <option value="natal">Natal (Cá nhân)</option>
                <option value="synastry">Synastry (Tương hợp)</option>
            </select>
        </div>

        <!-- DROPDOWN GÓC (Chỉ hiện ở Natal) -->
        <div class="mb-6" id="angle-container">
            <label for="angle-select" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Chọn góc</label>
            <select id="angle-select" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="soft">Mềm/Trùng (Tích cực)</option>
                <option value="hard">Cứng (Tiêu cực)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div>
                <label for="planet-a-select" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Hành tinh A</label>
                <select id="planet-a-select" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </select>
            </div>
            <div>
                <label for="planet-b-select" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Hành tinh B</label>
                <select id="planet-b-select" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </select>
            </div>
        </div>
    </div>

    <div class="text-center mb-8 max-w-4xl mx-auto">
        <button id="submit-button" class="bg-blue-600 hover:bg-blue-500 dark:bg-green-600 dark:hover:bg-green-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:-translate-y-1">
            Xem kết quả
        </button>
    </div>

    <div id="results-container" class="hidden space-y-8 max-w-4xl mx-auto">
    </div>

    <audio id="daikim-sound" src="{{ url_for('static', filename='audio/Dai_Kim.m4a') }}" preload="auto"></audio>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const els = {
            mode: document.getElementById('mode-select'),
            angleContainer: document.getElementById('angle-container'),
            angle: document.getElementById('angle-select'),
            pA: document.getElementById('planet-a-select'),
            pB: document.getElementById('planet-b-select'),
            btn: document.getElementById('submit-button'),
            res: document.getElementById('results-container'),
            load: document.getElementById('loading-overlay')
        };

        let allData = { natal: [], synastry: [] }; // Store full data
        let imageData = {};
        const CHUA_CHON_TEXT = '-- Chọn --';

        function scaleTitle() {
            const title = document.getElementById('main-title');
            if (!title) return;
            
            // BƯỚC 1: Ép nó về size to chuẩn PC (36px ~ 4xl)
            let size = 36; 
            title.style.fontSize = size + 'px';
            
            // BƯỚC 2: Đo xem 90% chiều ngang màn hình thực tế là bao nhiêu
            const maxWidth = window.innerWidth * 0.9;

            // BƯỚC 3: Nếu là PC, maxWidth sẽ rất lớn (~1000px trở lên), 
            // chữ 36px (khoảng 400px) sẽ KHÔNG bị tràn -> Vòng lặp dừng ngay -> PC TO.
            
            // Nếu là Phone, maxWidth chỉ có ~350px, chữ 36px bị tràn -> 
            // Vòng lặp chạy để bóp nhỏ lại cho đến khi chui lọt 90% màn hình.
            while (title.scrollWidth > maxWidth && size > 10) {
                size -= 0.5;
                title.style.fontSize = size + 'px';
            }
        }

        async function init() {
            try {
                const [d, i] = await Promise.all([fetch('/api/planet-data'), fetch('/api/planet-images')]);
                const rawData = await d.json();
                imageData = await i.json();

                if (rawData.error) throw new Error(rawData.error);

                // Lưu data vào biến toàn cục
                allData = rawData; 

                // Render lần đầu theo mode mặc định (Natal)
                updateUIByMode(); 
                
                els.load.style.display = 'none';
                setTimeout(scaleTitle, 100);

            } catch (e) {
                els.load.innerHTML = `<p class="text-red-500">Lỗi: ${e.message}</p>`;
            }
        }

        function updateUIByMode() {
            const mode = els.mode.value;
            
            // 1. Toggle Angle Dropdown
            if (mode === 'natal') {
                els.angleContainer.classList.remove('hidden');
            } else {
                els.angleContainer.classList.add('hidden');
            }

            // 2. Render Planet Dropdowns based on Mode Data
            renderDropdowns(mode);
            els.res.classList.add('hidden');
            els.res.innerHTML = '';
        }

        els.mode.addEventListener('change', updateUIByMode);

        function createOption(value, text, code) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = text;
            if(code) opt.dataset.code = code;
            return opt;
        }

        function renderDropdowns(mode) {
            // Reset Dropdowns
            els.pA.innerHTML = '';
            els.pB.innerHTML = '';
            els.pA.appendChild(createOption("", CHUA_CHON_TEXT));
            els.pB.appendChild(createOption("", CHUA_CHON_TEXT));

            const dataList = (mode === 'natal') ? allData.natal : allData.synastry;

            if (dataList && dataList.length > 0) {
                dataList.forEach(p => {
                    els.pA.appendChild(createOption(p.name, p.name, p.code));
                    els.pB.appendChild(createOption(p.name, p.name, p.code));
                });
            }
        }

        function updateDropdownOptions(sourceDropdown, targetDropdown) {
            const mode = els.mode.value;
            const selectedValue = sourceDropdown.value;
            const options = targetDropdown.getElementsByTagName('option');

            // Tìm object hành tinh đang chọn để check xem có phải Cung Mọc không
            const dataList = (mode === 'natal') ? allData.natal : allData.synastry;
            const selectedPlanet = dataList.find(p => p.name === selectedValue);
            const isAsc = isAscendant(selectedPlanet);

            for (let i = 0; i < options.length; i++) {
                const option = options[i];
                if (option.value === selectedValue && selectedValue !== "") {
                    // Natal: Khóa trùng tuyệt đối. Synastry: Chỉ khóa trùng nếu là Cung Mọc.
                    if (mode === 'natal' || isAsc) {
                        option.disabled = true;
                        option.classList.add('text-gray-400', 'dark:text-gray-500');
                    } else {
                        option.disabled = false;
                        option.classList.remove('text-gray-400', 'dark:text-gray-500');
                    }
                } else {
                    option.disabled = false;
                    option.classList.remove('text-gray-400', 'dark:text-gray-500');
                }
            }
        }

        els.pA.addEventListener('change', (e) => {
            updateDropdownOptions(els.pA, els.pB);
            const mode = els.mode.value;
            const dataList = (mode === 'natal') ? allData.natal : allData.synastry;
            const p = dataList.find(x => x.name === e.target.value);

            // Chỉ xóa ô bên kia nếu: (Chế độ Natal trùng) HOẶC (Synastry trùng + là Cung Mọc)
            if (e.target.value !== "" && e.target.value === els.pB.value) {
                if (mode === 'natal' || isAscendant(p)) {
                    els.pB.value = "";
                    updateDropdownOptions(els.pB, els.pA);
                }
            }
        });

        els.pB.addEventListener('change', (e) => {
            updateDropdownOptions(els.pB, els.pA);
            const mode = els.mode.value;
            const dataList = (mode === 'natal') ? allData.natal : allData.synastry;
            const p = dataList.find(x => x.name === e.target.value);

            if (e.target.value !== "" && e.target.value === els.pA.value) {
                if (mode === 'natal' || isAscendant(p)) {
                    els.pA.value = "";
                    updateDropdownOptions(els.pA, els.pB);
                }
            }
        });

        // --- HELPER FUNCTIONS ---
        const isPersonal = (p) => p && p.type === 'Cá nhân';
        const isNonPersonal = (p) => p && p.type === 'Không cá nhân';
        const isNonPlanet = (p) => p && p.type === 'Không hành tinh';
        
        // Kiểm tra xem hành tinh có phải là Asc (Cung Mọc) không
        const isAscendant = (p) => {
            if (!p || !p.code) return false;
            const c = p.code.toLowerCase();
            return c === 'asc' || c === 'cungmoc' || c.includes('rising');
        };

        function renderExchangeBlock(receiver, giver, angle, blockTitle = "", mode = "natal") {
            if (!receiver || !giver) return '';

            let giveText = "";
            let receiveText = "";
            let arrowColorClass = "";
            let arrowBgColorClass = "";

            if (mode === 'natal') {
                // Logic Natal
                giveText = (angle === 'soft') ? giver.text_pos : giver.text_neg;
                receiveText = receiver.text_rec;
                arrowColorClass = (angle === 'soft') ? 'text-blue-700 dark:text-blue-300' : 'text-red-700 dark:text-red-300';
                arrowBgColorClass = (angle === 'soft') ? 'bg-blue-200 dark:bg-blue-900' : 'bg-red-200 dark:bg-red-900';
            } else {
                // Logic Synastry
                giveText = giver.text_give;
                receiveText = receiver.text_receive;
                // Synastry mặc định màu xanh (như Soft)
                arrowColorClass = 'text-blue-700 dark:text-blue-300';
                arrowBgColorClass = 'bg-blue-200 dark:bg-blue-900';
            }

            const giveImg = imageData.cho[giver.code] || 'https://placehold.co/250x250/333/fff?text=No+Img';
            const receiveImg = imageData.nhan[receiver.code] || 'https://placehold.co/250x250/333/fff?text=No+Img';

            const formattedGiveText = giveText ? giveText.replace(/\n/g, '<br>') : '';
            const formattedReceiveText = receiveText ? receiveText.replace(/\n/g, '<br>') : '';

            const titleHtml = blockTitle ? `<h2 class="text-xl md:text-2xl font-semibold text-center mb-6 text-blue-600 dark:text-green-400 border-b border-gray-200 dark:border-gray-700 pb-2">${blockTitle}</h2>` : '';

            return `
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-4 md:p-6 rounded-lg shadow-xl transition-all hover:shadow-2xl">
                    ${titleHtml}
                    <div class="max-w-3xl mx-auto">
                        <div class="grid grid-cols-2 gap-4 mb-2">
                            <h3 class="text-lg font-semibold text-center text-green-500 dark:text-green-400 uppercase tracking-wider">NHẬN</h3>
                            <h3 class="text-lg font-semibold text-center text-blue-500 dark:text-blue-400 uppercase tracking-wider">TRUYỀN</h3>
                        </div>
                        <div class="relative grid grid-cols-2 gap-4 mb-4">
                            <div class="flex justify-center">
                                <div class="aspect-square w-full bg-gray-50 dark:bg-gray-700 rounded-lg shadow-inner relative overflow-hidden border border-gray-100 dark:border-gray-600">
                                    <img src="${receiveImg}" onerror="this.src='https://placehold.co/250x250/333/fff?text=No+Img'" class="absolute inset-0 w-full h-full object-contain p-2">
                                </div>
                            </div>
                            <div class="flex justify-center">
                                <div class="aspect-square w-full bg-gray-50 dark:bg-gray-700 rounded-lg shadow-inner relative overflow-hidden border border-gray-100 dark:border-gray-600">
                                    <img src="${giveImg}" onerror="this.src='https://placehold.co/250x250/333/fff?text=No+Img'" class="absolute inset-0 w-full h-full object-contain p-2">
                                </div>
                            </div>
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div class="p-3 md:p-4 rounded-full ${arrowBgColorClass} ${arrowColorClass} shadow-2xl border-4 border-white dark:border-gray-800 animate-pulse z-10">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-14 md:w-14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex justify-center">
                                <div class="w-full bg-gray-50 dark:bg-gray-700 rounded-lg p-3 md:p-4 shadow-sm border border-gray-100 dark:border-gray-600">
                                    <p class="text-gray-900 dark:text-gray-100 text-left w-full font-medium" style="font-size: clamp(0.8rem, 2vw, 1rem); line-height: 1.6;">
                                        ${formattedReceiveText || '(Không có dữ liệu Nhận)'}
                                    </p>
                                </div>
                            </div>
                            <div class="flex justify-center">
                                <div class="w-full bg-gray-50 dark:bg-gray-700 rounded-lg p-3 md:p-4 shadow-sm border border-gray-100 dark:border-gray-600">
                                    <p class="text-gray-900 dark:text-gray-100 text-left w-full font-medium" style="font-size: clamp(0.8rem, 2vw, 1rem); line-height: 1.6;">
                                        ${formattedGiveText || '(Không có dữ liệu Truyền)'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderError(message) {
            els.res.innerHTML = `
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-4 md:p-6 rounded-lg shadow-xl text-center">
                    <h2 class="text-2xl md:text-4xl font-bold text-red-500 whitespace-nowrap">${message}</h2>
                </div>
            `;
            els.res.classList.remove('hidden');
        }

        els.btn.addEventListener('click', () => {
            const mode = els.mode.value;
            const pA_name = els.pA.value;
            const pB_name = els.pB.value;

            if (!pA_name || !pB_name) {
                els.res.classList.add('hidden');
                els.res.innerHTML = '';
                return;
            }

            const dataList = (mode === 'natal') ? allData.natal : allData.synastry;
            const pA = dataList.find(p => p.name === pA_name);
            const pB = dataList.find(p => p.name === pB_name);

            if (!pA || !pB) {
                renderError("Lỗi không tìm thấy dữ liệu hành tinh.");
                return;
            }

            let htmlResult = '';

            // ===== LOGIC NATAL =====
            if (mode === 'natal') {
                const angle = els.angle.value;

                // Logic âm thanh "Đại Kim" (Chỉ áp dụng ở Natal)
                if (isNonPersonal(pA) && isNonPersonal(pB)) {
                    const sound = document.getElementById('daikim-sound');
                    if(sound) {
                        sound.play().catch(e => console.log("Lỗi phát nhạc:", e));
                    }
                    renderError("HỌC HÀNH THẾ À?!?");
                    return;
                }

                if (isPersonal(pA) && isPersonal(pB)) {
                    htmlResult += renderExchangeBlock(pA, pB, angle, "Kết quả 1", "natal");
                    htmlResult += renderExchangeBlock(pB, pA, angle, "Kết quả 2", "natal");
                }
                else if (isNonPersonal(pA) && (isPersonal(pB) || isNonPlanet(pB))) {
                    htmlResult = renderExchangeBlock(pB, pA, angle, "", "natal");
                }
                else if (isNonPersonal(pB) && (isPersonal(pA) || isNonPlanet(pA))) {
                    htmlResult = renderExchangeBlock(pA, pB, angle, "", "natal");
                }
                else if (isPersonal(pA) && isNonPlanet(pB)) {
                    htmlResult = renderExchangeBlock(pB, pA, angle, "", "natal");
                }
                else if (isPersonal(pB) && isNonPlanet(pA)) {
                    htmlResult = renderExchangeBlock(pA, pB, angle, "", "natal");
                }
                else {
                    renderError("Tổ hợp này chưa được định nghĩa (Natal).");
                    return;
                }
            }
            
            // ===== LOGIC SYNASTRY =====
            else {
                const hasAscA = isAscendant(pA);
                const hasAscB = isAscendant(pB);

                if (hasAscA || hasAscB) {
                    // Case: Có Cung Mọc -> Chỉ hiện 1 kết quả
                    // Cung Mọc luôn là NHẬN (Receiver), hành tinh kia là TRUYỀN (Giver)
                    if (hasAscA) {
                        // A là Asc -> A nhận, B truyền
                        htmlResult = renderExchangeBlock(pA, pB, 'soft', "Kết quả (Asc)", "synastry");
                    } else {
                        // B là Asc -> B nhận, A truyền
                        htmlResult = renderExchangeBlock(pB, pA, 'soft', "Kết quả (Asc)", "synastry");
                    }
                } else {
                     // Case: Không có Cung Mọc
                    if (pA_name === pB_name) {
                        // Nếu chọn trùng (Vd: Sun-Sun), chỉ hiện 1 block duy nhất
                        htmlResult = renderExchangeBlock(pA, pB, 'soft', "Kết quả", "synastry");
                    } else {
                        // Nếu khác nhau, hiện 2 chiều trao đổi
                        htmlResult += renderExchangeBlock(pA, pB, 'soft', "Kết quả 1", "synastry");
                        htmlResult += renderExchangeBlock(pB, pA, 'soft', "Kết quả 2", "synastry");
                    }
                }
            }

            if (htmlResult) {
                els.res.innerHTML = htmlResult;
                els.res.classList.remove('hidden');
            }
        });

        window.addEventListener('resize', scaleTitle);
        init();
    });
</script>
{% endblock %}
